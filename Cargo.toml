[package]
name    = "UPLOADER19"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "UPLOADER19"
path = "src/main.rs"

[dependencies]
# Cross-platform serial port library – works on Windows, Linux, macOS.
# Wraps the Windows CreateFile / SetCommState / WriteFile API internally.
serialport = "4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
